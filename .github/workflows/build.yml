name: build-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    # Weekly check for new builds (images are version-pinned, so this only
    # rebuilds when the Dockerfile/ARG changes)
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

env:
  OPENCODE_VERSION: "1.18.35"
  UV_VERSION: "0.13.0"
  SERENA_VERSION: "v1.7.0"
  GO_VERSION: "1.26.9"
  NODE_VERSION: "26"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  TEMPL_VERSION: "v0.3.977"
  FORGEJO_MCP_VERSION: "v3.2.0"

jobs:
  opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: agents/opencode
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-opencode:latest
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-opencode:${{ env.OPENCODE_VERSION }}

  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: agents/attach
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-attach:latest
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-attach:${{ env.OPENCODE_VERSION }}

  devbox:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - id: stamp
        run: |
          # Unique, monotonically increasing tag per build: UTC date + run
          # number. KubeOpenCode does not support imagePullPolicy: Always, so
          # the executor image must be referenced by an immutable tag that
          # changes whenever the image is rebuilt.
          echo "stamp=$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: agents/devbox
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            UV_VERSION=${{ env.UV_VERSION }}
            SERENA_VERSION=${{ env.SERENA_VERSION }}
            GO_VERSION=${{ env.GO_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-devbox:latest
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-devbox:uv${{ env.UV_VERSION }}-serena${{ env.SERENA_VERSION }}
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-devbox:uv${{ env.UV_VERSION }}-serena${{ env.SERENA_VERSION }}-${{ steps.stamp.outputs.stamp }}
      - name: Summary
        run: |
          echo "executorImage: ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-devbox:uv${UV_VERSION}-serena${SERENA_VERSION}-${{ steps.stamp.outputs.stamp }}" >> "$GITHUB_STEP_SUMMARY"

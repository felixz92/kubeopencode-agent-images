name: build-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    # Weekly check for new builds (images are version-pinned, so this only
    # rebuilds when the Dockerfile/ARG changes)
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

env:
  OPENCODE_VERSION: "1.18.35"
  UV_VERSION: "0.13.0"
  SERENA_VERSION: "v1.7.0"
  GO_VERSION: "1.26.9"
  NODE_VERSION: "26"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  TEMPL_VERSION: "v0.3.977"
  FORGEJO_MCP_VERSION: "v3.2.0"
  OPEN_CODE_REVIEW_VERSION: "1.12.13"
  # CI executor image (builder/golang, agents/reviewer)
  TASK_VERSION: "3.45.4"
  # homelab executor image (agents/homelab)
  KUBECTL_VERSION: "1.37.1"
  FLUX_VERSION: "2.9.6"
  TERRAFORM_VERSION: "1.16.5"
  TALOSCTL_VERSION: "1.13.11"
  KREW_VERSION: "v0.5.0"
  K8S_MCP_VERSION: "0.0.67"
  FLUX_OPERATOR_MCP_VERSION: "0.61.0"
  MCP_GRAFANA_VERSION: "2.0.2"
  MCP_VICTORIALOGS_VERSION: "1.9.0"
  GH_CLI_VERSION: "2.94.0"
  # opencode-telegram-bot: upstream commit to build from (upstream GHCR package
  # is private, so we build our own image)
  OTB_COMMIT: "2801cb8c5d703d7c45f830c1c74a8805355e5749"

jobs:
  opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: agents/opencode
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-opencode:latest
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-opencode:${{ env.OPENCODE_VERSION }}

  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: agents/attach
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OPENCODE_VERSION=${{ env.OPENCODE_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-attach:latest
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-attach:${{ env.OPENCODE_VERSION }}

  devbox:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - id: stamp
        run: |
          # Unique, monotonically increasing tag per build: UTC date + run
          # number. KubeOpenCode does not support imagePullPolicy: Always, so
          # the executor image must be referenced by an immutable tag that
          # changes whenever the image is rebuilt.
          echo "stamp=$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: agents/devbox
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            UV_VERSION=${{ env.UV_VERSION }}
            SERENA_VERSION=${{ env.SERENA_VERSION }}
            GO_VERSION=${{ env.GO_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-devbox:latest
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-devbox:uv${{ env.UV_VERSION }}-serena${{ env.SERENA_VERSION }}
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-devbox:uv${{ env.UV_VERSION }}-serena${{ env.SERENA_VERSION }}-${{ steps.stamp.outputs.stamp }}
      - name: Summary
        run: |
          echo "executorImage: ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-devbox:uv${UV_VERSION}-serena${SERENA_VERSION}-${{ steps.stamp.outputs.stamp }}" >> "$GITHUB_STEP_SUMMARY"

  homelab:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - id: stamp
        run: |
          # Same imagePullPolicy caveat as the devbox image: executor images
          # must be referenced by an immutable tag that changes per build.
          echo "stamp=$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: agents/homelab
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KUBECTL_VERSION=${{ env.KUBECTL_VERSION }}
            FLUX_VERSION=${{ env.FLUX_VERSION }}
            TERRAFORM_VERSION=${{ env.TERRAFORM_VERSION }}
            TALOSCTL_VERSION=${{ env.TALOSCTL_VERSION }}
            KREW_VERSION=${{ env.KREW_VERSION }}
            K8S_MCP_VERSION=${{ env.K8S_MCP_VERSION }}
            FLUX_OPERATOR_MCP_VERSION=${{ env.FLUX_OPERATOR_MCP_VERSION }}
            MCP_GRAFANA_VERSION=${{ env.MCP_GRAFANA_VERSION }}
            MCP_VICTORIALOGS_VERSION=${{ env.MCP_VICTORIALOGS_VERSION }}
            GH_CLI_VERSION=${{ env.GH_CLI_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-homelab:latest
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-homelab:tf${{ env.TERRAFORM_VERSION }}-talosctl${{ env.TALOSCTL_VERSION }}
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-homelab:tf${{ env.TERRAFORM_VERSION }}-talosctl${{ env.TALOSCTL_VERSION }}-${{ steps.stamp.outputs.stamp }}
      - name: Summary
        run: |
          echo "executorImage: ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-homelab:tf${TERRAFORM_VERSION}-talosctl${TALOSCTL_VERSION}-${{ steps.stamp.outputs.stamp }}" >> "$GITHUB_STEP_SUMMARY"

  builder:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - id: stamp
        run: |
          # Same imagePullPolicy caveat as the devbox image: executor images
          # must be referenced by an immutable tag that changes per build.
          echo "stamp=$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: builder/golang
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TASK_VERSION=${{ env.TASK_VERSION }}
            GOLANGCI_LINT_VERSION=${{ env.GOLANGCI_LINT_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/argo-golang-builder:latest
            ghcr.io/${{ github.repository_owner }}/argo-golang-builder:go${{ env.GO_VERSION }}-task${{ env.TASK_VERSION }}
            ghcr.io/${{ github.repository_owner }}/argo-golang-builder:go${{ env.GO_VERSION }}-task${{ env.TASK_VERSION }}-${{ steps.stamp.outputs.stamp }}
      - name: Summary
        run: |
          echo "executorImage: ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-builder:go${GO_VERSION}-task${TASK_VERSION}-${{ steps.stamp.outputs.stamp }}" >> "$GITHUB_STEP_SUMMARY"

  reviewer:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - id: stamp
        run: |
          # Same imagePullPolicy caveat as the devbox image: executor images
          # must be referenced by an immutable tag that changes per build.
          echo "stamp=$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: agents/reviewer
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            OPEN_CODE_REVIEW_VERSION=${{ env.OPEN_CODE_REVIEW_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-reviewer:latest
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-reviewer:node${{ env.NODE_VERSION }}-ocr${{ env.OPEN_CODE_REVIEW_VERSION }}
            ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-reviewer:node${{ env.NODE_VERSION }}-ocr${{ env.OPEN_CODE_REVIEW_VERSION }}-${{ steps.stamp.outputs.stamp }}
      - name: Summary
        run: |
          echo "executorImage: ghcr.io/${{ github.repository_owner }}/kubeopencode-agent-reviewer:node${NODE_VERSION}-ocr${OPEN_CODE_REVIEW_VERSION}-${{ steps.stamp.outputs.stamp }}" >> "$GITHUB_STEP_SUMMARY"

  opencode-telegram-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: agents/opencode-telegram-bot
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OTB_COMMIT=${{ env.OTB_COMMIT }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kubeopencode-telegram-bot:latest
            ghcr.io/${{ github.repository_owner }}/kubeopencode-telegram-bot:${{ env.OTB_COMMIT }}
